name: Build School Management System APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK and Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This repository has lib/ and pubspec.yaml but no android/ folder.
      - name: Generate Android platform files
        run: flutter create --project-name school_management_system --org com.ilyasmobile --platforms android .

      - name: Set the existing application ID
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = .*/applicationId = "com.ilyasmobile.schoolmanagementsystem"/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i "s/applicationId .*/applicationId 'com.ilyasmobile.schoolmanagementsystem'/" android/app/build.gradle
          else
            echo "Android Gradle file not found"
            exit 1
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Configure Play Store upload signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing signing secrets. Add all four ANDROID_* repository secrets."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/upload-keystore.jks"

          if [ ! -s "$GITHUB_WORKSPACE/upload-keystore.jks" ]; then
            echo "Keystore could not be decoded."
            exit 1
          fi

          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      - name: Configure release signing
        shell: bash
        run: |
          if ! grep -q '^android.newDsl=' android/gradle.properties 2>/dev/null; then
            echo 'android.newDsl=false' >> android/gradle.properties
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          if "import java.util.Properties" not in s:
              s = "import java.util.Properties\n" + s

          marker = "// Added by CI: release signing configuration"
          if marker not in s:
              signing = r"""

          // Added by CI: release signing configuration
          android {
              signingConfigs {
                  create("release") {
                      val props = Properties()
                      val propsFile = rootProject.file("key.properties")
                      require(propsFile.exists()) { "android/key.properties is missing" }
                      props.load(propsFile.inputStream())
                      storeFile = rootProject.file(props["storeFile"] as String)
                      storePassword = props["storePassword"] as String
                      keyAlias = props["keyAlias"] as String
                      keyPassword = props["keyPassword"] as String
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          """
              s = s.rstrip() + signing + "\n"

          p.write_text(s)
          print("Release signing configuration added.")
          PY

      # Use Flutter CLI so outputs are placed in Flutter's standard build/
      # directory, not assumed to be under android/app/build/.
      - name: Build release APK
        run: flutter build apk --release

      - name: Build signed Play Store AAB
        run: flutter build appbundle --release

      - name: Find and prepare APK and AAB
        shell: bash
        run: |
          set -e
          mkdir -p artifacts

          echo "Searching the whole workspace for APK files..."
          find . -type f -name "*.apk" -not -path "./.git/*" -print

          echo "Searching the whole workspace for AAB files..."
          find . -type f -name "*.aab" -not -path "./.git/*" -print

          APK_FILE="$(find build android -type f -name "*.apk" 2>/dev/null | head -n 1 || true)"
          AAB_FILE="$(find build android -type f -name "*.aab" 2>/dev/null | head -n 1 || true)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK file found. Flutter build APK did not create an output."
            exit 1
          fi

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: No AAB file found. Flutter build appbundle did not create an output."
            exit 1
          fi

          cp "$APK_FILE" artifacts/School-Management-System.apk
          cp "$AAB_FILE" artifacts/School-Management-System.aab

          echo "Files prepared for upload:"
          ls -lh artifacts/

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: School-Management-System-APK-and-AAB
          path: artifacts/*
          if-no-files-found: error
