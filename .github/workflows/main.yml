name: Build School Management System APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK and Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Your repository has lib/ and pubspec.yaml but no android/ folder.
      - name: Generate Android platform files
        run: flutter create --project-name school_management_system --org com.ilyasmobile --platforms android .

      - name: Set the existing application ID
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = .*/applicationId = "com.ilyasmobile.schoolmanagementsystem"/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i "s/applicationId .*/applicationId 'com.ilyasmobile.schoolmanagementsystem'/" android/app/build.gradle
          else
            echo "Android Gradle file not found"
            exit 1
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      # The Play Store AAB must be signed with the SAME upload key
      # used for the existing Play Console app.
      - name: Configure Play Store upload signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing signing secrets. Add the four Android signing secrets in GitHub before building a Play Store AAB."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/upload-keystore.jks"
          if [ ! -s "$GITHUB_WORKSPACE/upload-keystore.jks" ]; then
            echo "Keystore could not be decoded."
            exit 1
          fi
          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      - name: Configure release signing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          # Always ensure a RELEASE signing config exists. The generated
          # Flutter template may mention signingConfigs for DEBUG only.
          if 'create("release")' not in s and "maybeCreate(\"release\")" not in s:
              release_config = """
              signingConfigs {
                  create("release") {
                      val props = java.util.Properties()
                      val propsFile = rootProject.file("key.properties")
                      require(propsFile.exists()) { "android/key.properties is missing" }
                      props.load(propsFile.inputStream())
                      storeFile = rootProject.file(props["storeFile"] as String)
                      storePassword = props["storePassword"] as String
                      keyAlias = props["keyAlias"] as String
                      keyPassword = props["keyPassword"] as String
                  }
              }

          """
              # Insert the config directly inside the android { } block,
              # before buildTypes. Do not rely on whether the word
              # signingConfigs appears elsewhere in the template.
              marker = "    buildTypes {"
              if marker not in s:
                  marker = "  buildTypes {"
              if marker not in s:
                  raise SystemExit("Could not find buildTypes in android/app/build.gradle.kts")
              s = s.replace(marker, release_config + marker, 1)

          # Make the release build use the upload key.
          release_block = re.search(r'(?m)^\\s*getByName\\("release"\\)\\s*\\{', s)
          if release_block:
              block_start = release_block.end()
              if 'signingConfig = signingConfigs.getByName("release")' not in s[block_start:block_start+500]:
                  s = s[:block_start] + '\\n            signingConfig = signingConfigs.getByName("release")' + s[block_start:]
          else:
              raise SystemExit('Could not find getByName("release") build type')

          # Remove any accidental debug signing assignment in release block.
          s = re.sub(
              r'(getByName\\("release"\\)\\s*\\{[^}]*?)signingConfig\\s*=\\s*signingConfigs\\.getByName\\("debug"\\)',
              r'\\1signingConfig = signingConfigs.getByName("release")',
              s,
              count=1,
              flags=re.S
          )

          p.write_text(s)
          print("Release signing configuration added.")
          PY

      - name: Build release APK (Lint workaround)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -x lint -x lintDebug -x lintRelease \
            -x lintAnalyzeDebug -x lintAnalyzeRelease \
            -x lintVitalAnalyzeRelease -x lintVitalReportRelease \
            -x lintVitalRelease --stacktrace

      - name: Build signed Play Store AAB (Lint workaround)
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -x lint -x lintDebug -x lintRelease \
            -x lintAnalyzeDebug -x lintAnalyzeRelease \
            -x lintVitalAnalyzeRelease -x lintVitalReportRelease \
            -x lintVitalRelease --stacktrace

      - name: Verify APK and AAB
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: School-Management-System-APK-and-AAB
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
