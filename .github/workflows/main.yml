name: Build School Management System APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This repository contains lib/ and pubspec.yaml but no Android
      # platform folder, so generate the Android project files here.
      - name: Generate Android platform
        run: flutter create --project-name school_management_system --org com.ilyasmobile --platforms android .

      - name: Set Android application ID
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = .*/applicationId = "com.ilyasmobile.schoolmanagementsystem"/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i "s/applicationId .*/applicationId 'com.ilyasmobile.schoolmanagementsystem'/" android/app/build.gradle
          else
            echo "Android Gradle file not found"
            exit 1
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      # Skip Android's lint tasks because the current Android Gradle
      # lint analyzer crashes in this project's GitHub build environment.
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -x lint \
            -x lintDebug \
            -x lintRelease \
            -x lintAnalyzeDebug \
            -x lintAnalyzeRelease \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            -x lintVitalRelease \
            --stacktrace

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -s "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: School-Management-System-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
